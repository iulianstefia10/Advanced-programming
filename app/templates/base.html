<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}DataHub{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Project stylesheets -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/influxdb.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/weather.css') }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div>DataHub · Advanced Programming</div>
            <div class="mt-1">
                Flask · SQLAlchemy · SQLite · InfluxDB
            </div>
        </div>
    </footer>
</body>
</html>
