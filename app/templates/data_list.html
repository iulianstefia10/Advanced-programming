{% extends "base.html" %}
{% block content %}
<div class="card mx-auto mb-5" style="max-width: 800px;">
    <div class="card-header text-center">
        {{ title }}
    </div>
    
    {% if plot_url %}
    <div class="card-body text-center p-0">
        <img src="data:image/png;base64,{{ plot_url }}" class="img-fluid rounded-bottom" alt="Chart">
    </div>
    {% endif %}

    <ul class="list-group list-group-flush">
        {% for item in items %}
        <li class="list-group-item d-flex justify-content-between align-items-center px-4 py-3">
            <span class="fw-bold">{{ item.name }}</span>
            <span class="badge badge-accent rounded-pill px-3 py-2 fs-6">{{ item.value }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
<div class="text-center mb-5">
    <a href="/dashboard" class="btn btn-outline-light px-4">&larr; Back to Dashboard</a>
</div>
{% endblock %}
